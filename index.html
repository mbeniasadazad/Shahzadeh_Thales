<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>قضیه تالس — باغ شاهزاده ماهان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{height:100%;overflow:hidden;font-family:'Vazirmatn',Tahoma,sans-serif;
  background:#0a1a1f;color:#eaf0ff;-webkit-tap-highlight-color:transparent;user-select:none}

#app{display:flex;flex-direction:column;height:100%;overflow:hidden}
header{flex:0 0 auto;padding:8px 12px;background:rgba(10,20,30,.88);
  border-bottom:1px solid rgba(94,234,212,.2);
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.header-title{font-weight:900;font-size:clamp(12px,2.8vw,15px);
  background:linear-gradient(90deg,#5eead4,#fbbf24);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;line-height:1.3}
.header-subtitle{font-size:clamp(9px, 1.8vw, 11px); color:#a8bccc; font-weight:700; margin-top: 2px;}

/* Header Controls */
.header-controls{display:flex;gap:8px;align-items:center}
.header-btn{flex:0 0 auto;width:34px;height:34px;padding:0;border-radius:50%;
  border:1px solid rgba(94,234,212,.25);background:rgba(94,234,212,.08);
  color:#eaf0ff;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.header-btn:hover{background:rgba(94,234,212,.2)}
.header-btn.muted{background:rgba(255,120,120,.25);border-color:rgba(255,120,120,.55)}

/* Pulse animation */
.pulse-audio {
  animation: pulseRing 1.5s infinite;
  border-color: #5eead4 !important;
}
@keyframes pulseRing {
  0% { box-shadow: 0 0 0 0 rgba(94,234,212,0.7); }
  70% { box-shadow: 0 0 0 10px rgba(94,234,212,0); }
  100% { box-shadow: 0 0 0 0 rgba(94,234,212,0); }
}

main{flex:1 1 0;position:relative;min-height:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;pointer-events:none;z-index:2}
#overlay>*{pointer-events:auto}

/* Audio Prompt Overlay */
#audio-prompt {
  position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
  background: rgba(10, 25, 32, 0.9); backdrop-filter: blur(5px);
  color: #fff; padding: 10px 20px; border-radius: 30px;
  font-weight: 900; font-size: 14px; border: 2px solid #5eead4;
  box-shadow: 0 4px 15px rgba(94, 234, 212, 0.4);
  z-index: 10; cursor: pointer; pointer-events: auto;
  transition: opacity 0.5s, visibility 0.5s;
  display: flex; align-items: center; gap: 8px;
  animation: bounce 2s infinite; width: max-content; max-width: 90%;
  text-align: center;
}
#audio-prompt.hidden { opacity: 0; visibility: hidden; }
@keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); } 40% { transform: translateX(-50%) translateY(-10px); } 60% { transform: translateX(-50%) translateY(-5px); } }

.panel{position:absolute;bottom:10px;left:10px;right:10px;padding:10px;
  background:rgba(10,25,32,.95);border:1px solid rgba(94,234,212,.3);
  border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.8);
  color:#eaf0ff;display:flex;flex-direction:column;align-items:center;gap:6px;
  backdrop-filter: blur(5px);}

/* ═══════════════════════════════════════════════
   فرمول ریاضی تضمینی (HTML/CSS - بدون باگ در ایتا)
   ═══════════════════════════════════════════════ */
.formula-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  direction: ltr;
  font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
  font-size: 28px;
  font-weight: 900;
  color: #fff;
  margin: 5px 0;
  line-height: 1.1;
}

.frac-box {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  margin: 0 12px;
}

.frac-num {
  border-bottom: 2px solid #5eead4;
  padding: 0 6px 2px 6px;
}

.frac-den {
  padding: 2px 6px 0 6px;
}

.math-var { color: #5eead4; font-style: italic; }
.math-prime { color: #fbbf24; font-size: 0.8em; vertical-align: super; font-style: normal; }
.math-eq { color: #fff; margin: 0 10px; font-size: 1.2em; }

/* Designer Name */
.designer-name {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(10px, 1.8vw, 13px); 
  background: linear-gradient(90deg, #5eead4, #fbbf24, #ff8fab);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  margin-top: 2px;
  opacity: 0.85;
  text-align: center;
  direction: ltr;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<div id="app">
  <header>
    <div>
      <div class="header-title">📖 قضیهٔ تالس در باغ شاهزاده</div>
      <div class="header-subtitle">ماهان، کرمان</div>
    </div>
    <div class="header-controls">
      <button id="replayBtn" class="header-btn" title="نمایش دوباره">⟲</button>
      <button id="muteBtn" class="header-btn pulse-audio" title="قطع/وصل صدا">🔊</button>
    </div>
  </header>
  <main>
    <canvas id="stage"></canvas>
    <div id="overlay"></div>
    
    <div id="audio-prompt">
      <span>🔊 برای شنیدن صدای طبیعت کلیک کنید</span>
    </div>
  </main>
</div>

<script>
(function(){
'use strict';

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);

/* ═══════════════════════════════════════════════
   تنظیمات هندسی (تغییر ارتفاع نهایی و خطوط موازی)
   ═══════════════════════════════════════════════ */
// خطوط موازی روی لبه پله‌ها (0.33 بالا، 0.48 وسط، 0.63 پایین)
const CHANNELS_Y   = [0.33, 0.48, 0.63];  
const ELDER_START_X= 0.08;                 
const ELDER_END_X  = 0.42; 
const YOUNGER_START_X = 0.85;              
const YOUNGER_END_X   = 0.58; 
const START_Y      = 0.92;                 
// نقطه پایان: 0.13 (ورودی عمارت)
const END_Y        = 0.13; 

/* ═══════════════════════════════════════════════
   تصویر باغ
   ═══════════════════════════════════════════════ */
const IMG_URLS = [
  'https://s6.uupload.ir/files/shazdeh_garden,_kerman,_iran_iraninreality_m5zn.jpeg',
  'https://i.imgur.com/nOJZv0h.jpeg'
];

const mansionImg = new Image();
let imgLoaded = false;

function tryLoadImage(idx) {
  if (idx >= IMG_URLS.length) {
    render(0);
    return;
  }
  mansionImg.onload = () => {
    imgLoaded = true;
    render(0);
  };
  mansionImg.onerror = () => { tryLoadImage(idx + 1); };
  mansionImg.src = IMG_URLS[idx];
}
tryLoadImage(0);

/* ═══════════════════════════════════════════════
   موتور صدای طبیعت
   ═══════════════════════════════════════════════ */
let AC = null;
let MASTER = null;
let MUTED = false;
const muteBtnEl = document.getElementById('muteBtn');
const audioPrompt = document.getElementById('audio-prompt');

function initAudioEngine() {
  if (AC) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    AC = new AudioContext();
    MASTER = AC.createGain();
    MASTER.gain.value = 1;
    MASTER.connect(AC.destination);
  } catch(e) {}
}

const Ambience = {
  active: false, nodes: [], timers: [], ambGain: null, BASE: 0.6,
  
  _noise(dur, kind){
    if(!AC) return null;
    const buf = AC.createBuffer(1, Math.floor(AC.sampleRate * dur), AC.sampleRate);
    const d = buf.getChannelData(0);
    if(kind === 'pink'){
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(let i=0;i<d.length;i++){
        const w=Math.random()*2-1;
        b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759;
        b2=.96900*b2+w*.1538520; b3=.86650*b3+w*.3104856;
        b4=.55000*b4+w*.5329522; b5=-.7616*b5-w*.0168980;
        d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926;
      }
    } else if(kind === 'brown'){
      let last=0;
      for(let i=0;i<d.length;i++){
        const w=Math.random()*2-1;
        last=(last+.02*w)/1.02; 
        d[i]=last*3.5;
      }
    }
    return buf;
  },
  
  start(){
    if(!AC || !MASTER || this.active) return;
    try {
      this.ambGain = AC.createGain(); 
      this.ambGain.gain.value = 0;
      this.ambGain.connect(MASTER);
      
      const water = AC.createBufferSource();
      water.buffer = this._noise(4, 'brown');
      water.loop = true;
      const wf = AC.createBiquadFilter(); 
      wf.type = 'bandpass';
      wf.frequency.value = 1000; 
      wf.Q.value = 1.0;
      const wg = AC.createGain(); 
      wg.gain.value = .5;
      water.connect(wf).connect(wg).connect(this.ambGain); 
      water.start();
      
      const wLfo = AC.createOscillator(); 
      wLfo.frequency.value = .25;
      const wLfoG = AC.createGain(); 
      wLfoG.gain.value = 300;
      wLfo.connect(wLfoG).connect(wf.frequency); 
      wLfo.start();

      const wind = AC.createBufferSource();
      wind.buffer = this._noise(4, 'pink');
      wind.loop = true;
      const wf2 = AC.createBiquadFilter(); 
      wf2.type = 'lowpass';
      wf2.frequency.value = 400; 
      wf2.Q.value = .5;
      const wg2 = AC.createGain(); 
      wg2.gain.value = .4;
      wind.connect(wf2).connect(wg2).connect(this.ambGain); 
      wind.start();
      
      this.nodes = [water, wind, wLfo];
      this.active = true;
      
      this.ambGain.gain.linearRampToValueAtTime(this.BASE, AC.currentTime + 2.0);
      this._schedBird();
    } catch(e) {}
  },
  
  _schedBird(){
    if(!this.active) return;
    const d = 1.5 + Math.random() * 4;
    const id = setTimeout(() => {
      if(this.active && !MUTED) this._bird();
      this._schedBird();
    }, d * 1000);
    this.timers.push(id);
  },
  
  _bird(){
    if(!this.ambGain || !AC) return;
    try {
      const t0 = AC.currentTime;
      const pan = AC.createStereoPanner ? AC.createStereoPanner() : null;
      const out = pan || this.ambGain;
      if(pan){ pan.pan.value = (Math.random() * 2 - 1) * .7; pan.connect(this.ambGain); }
      const n = 2 + Math.floor(Math.random() * 4);
      const base = 2000 + Math.random() * 1400;
      
      for(let i=0; i<n; i++){
        const st = t0 + i * (.06 + Math.random() * .06);
        const du = .06 + Math.random() * .08;
        const o = AC.createOscillator(), g = AC.createGain();
        const f = base * (.8 + Math.random() * .4);
        o.type = 'sine';
        o.frequency.setValueAtTime(f, st);
        o.frequency.exponentialRampToValueAtTime(f * 1.18, st + du * .4);
        o.frequency.exponentialRampToValueAtTime(f * .86, st + du);
        g.gain.setValueAtTime(0, st);
        g.gain.linearRampToValueAtTime(.15, st + .01);
        g.gain.exponentialRampToValueAtTime(.001, st + du);
        o.connect(g).connect(out);
        o.start(st); o.stop(st + du + .02);
      }
    } catch(e){}
  }
};

function unlockAudio() {
  initAudioEngine();
  if (!AC) return;
  
  if (AC.state === 'suspended') {
    AC.resume().then(() => {
      Ambience.start();
      muteBtnEl.classList.remove('pulse-audio');
      audioPrompt.classList.add('hidden');
    }).catch(e => console.warn("Resume failed", e));
  } else {
    Ambience.start();
    muteBtnEl.classList.remove('pulse-audio');
    audioPrompt.classList.add('hidden');
  }
}

/* ═══════ CANVAS & PERFORMANCE OPTIMIZATION ═══════ */
const cv=document.getElementById('stage');
const ctx=cv.getContext('2d', { alpha: false }); 
let Wc=0, Hc=0, DPR=1;
let gardenerSize = 40;
let resizeAttempts=0;
let globalTime = 0;

let waterParticles = [];

function resize(){
  const r=cv.getBoundingClientRect();
  Wc=r.width; Hc=r.height;
  if(Wc<10 || Hc<10){
    resizeAttempts++;
    if(resizeAttempts<60){ requestAnimationFrame(resize); return; }
    Wc=window.innerWidth||800; Hc=(window.innerHeight||600)-90;
  }
  resizeAttempts=0;
  DPR=Math.min(window.devicePixelRatio||1, 1.5); 
  cv.width=Math.round(Wc*DPR); cv.height=Math.round(Hc*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  gardenerSize = Math.min(Wc, Hc) * 0.07;
  
  initWaterParticles();
}
window.addEventListener('resize', ()=>{ resizeAttempts=0; resize(); render(0); });

function initWaterParticles() {
  waterParticles = [];
  const startY = Hc * 0.38;
  const endY = Hc * 0.92;
  
  for(let i = 0; i < 40; i++) {
    waterParticles.push({
      x: Wc * 0.5 + (Math.random() - 0.5) * (Wc * 0.06),
      y: startY + Math.random() * (endY - startY),
      speed: 80 + Math.random() * 150,
      length: 15 + Math.random() * 30,
      alpha: 0.3 + Math.random() * 0.5,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 2 + Math.random() * 3
    });
  }
}

/* ═══════ STATE ═══════ */
const TOTAL=11.5;
const state = { story:{t:0, running:true, fired:[]} };

/* ═══════ DRAW BACKGROUND & WATER ═══════ */
function drawBackground(alpha, dt){
  if(alpha === undefined) alpha = 1;
  if(alpha <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = alpha;

  if(imgLoaded){
    const iw = mansionImg.naturalWidth;
    const ih = mansionImg.naturalHeight;
    const scale = Math.max(Wc/iw, Hc/ih);
    const dw = iw * scale;
    const dh = ih * scale;
    const dx = (Wc - dw) / 2;
    const dy = (Hc - dh) / 2;
    ctx.drawImage(mansionImg, dx, dy, dw, dh);
    
    if(dt !== undefined) drawWaterFlow(dt, alpha);

    ctx.globalAlpha = alpha * 0.25;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, Wc, Hc);
  } else {
    const grd = ctx.createLinearGradient(0, 0, 0, Hc);
    grd.addColorStop(0, '#0a1a2e');
    grd.addColorStop(0.5, '#1e3a4f');
    grd.addColorStop(1, '#3d2a1f');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, Wc, Hc);
  }
  ctx.restore();
}

function drawWaterFlow(dt, alpha) {
  ctx.save();
  
  const centerX = Wc * 0.5;
  const startY = Hc * 0.38;
  const endY = Hc * 0.92;

  ctx.strokeStyle = `rgba(180, 240, 255, ${0.7 * alpha})`;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();

  waterParticles.forEach(p => {
    p.y += p.speed * dt;
    p.wobble += p.wobbleSpeed * dt;
    
    if(p.y > endY) {
      p.y = startY;
      p.x = centerX + (Math.random() - 0.5) * (Wc * 0.06);
    }
    
    const xOffset = Math.sin(p.wobble) * 4; 
    ctx.moveTo(p.x + xOffset, p.y);
    ctx.lineTo(p.x + xOffset, p.y + p.length);
  });
  ctx.stroke();

  ctx.fillStyle = `rgba(255, 255, 255, ${0.6 * alpha})`;
  CHANNELS_Y.forEach((yPct, i) => {
    const y = yPct * Hc;
    const pulse = Math.sin(globalTime * 5 + i) * 0.15 + 0.85;
    
    ctx.beginPath();
    ctx.ellipse(centerX, y, Wc * 0.06 * pulse, Hc * 0.015, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore();
}

/* ═══════ LAYOUT & PATHS ═══════ */
function getLayout(){
  return {
    channels: CHANNELS_Y.map(p => p * Hc),
    elder: {
      start: { x: ELDER_START_X * Wc, y: START_Y * Hc },
      end:   { x: ELDER_END_X * Wc,   y: END_Y   * Hc }
    },
    younger: {
      start: { x: YOUNGER_START_X * Wc, y: START_Y * Hc },
      end:   { x: YOUNGER_END_X * Wc,   y: END_Y   * Hc }
    }
  };
}

function getCrossings(){
  const L = getLayout();
  const elder = L.channels.map(cy => {
    const t = (cy - L.elder.start.y) / (L.elder.end.y - L.elder.start.y);
    return { x: L.elder.start.x + t * (L.elder.end.x - L.elder.start.x), y: cy };
  });
  const younger = L.channels.map(cy => {
    const t = (cy - L.younger.start.y) / (L.younger.end.y - L.younger.start.y);
    return { x: L.younger.start.x + t * (L.younger.end.x - L.younger.start.x), y: cy };
  });
  return { elder, younger };
}

function drawChannel(y, alpha, flow, color){
  if(alpha <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(0, y + 3);
  ctx.lineTo(Wc, y + 3);
  ctx.stroke();

  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.setLineDash([20, 12]);
  ctx.lineDashOffset = flow || 0;
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(Wc, y);
  ctx.stroke();

  ctx.restore();
}

function drawPath(p1, p2, progress, color, alpha){
  if(progress <= 0.001 || alpha <= 0.01) return;
  const ex = p1.x + (p2.x - p1.x) * progress;
  const ey = p1.y + (p2.y - p1.y) * progress;

  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(p1.x + 2, p1.y + 2);
  ctx.lineTo(ex + 2, ey + 2);
  ctx.stroke();

  ctx.strokeStyle = color + '80'; 
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(ex, ey);
  ctx.stroke();

  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(ex, ey);
  ctx.stroke();

  ctx.restore();
}

/* ═══════ GARDENERS (PATEH DESIGN) ═══════ */
function drawGardener(x, y, theme, alpha, isElder, walkPhase){
  if(alpha <= 0.01) return;
  const s = gardenerSize;
  const bob = walkPhase ? Math.abs(Math.sin(walkPhase * Math.PI * 6)) * s * 0.08 : 0;
  const cx = x;
  const cy = y - bob;

  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath();
  ctx.ellipse(x + s*0.1, y + s*0.05, s*0.6, s*0.15, 0, 0, Math.PI*2);
  ctx.fill();

  const legOff = walkPhase ? Math.sin(walkPhase * Math.PI * 6) * s * 0.2 : 0;
  const legGrd = ctx.createLinearGradient(cx, cy, cx, cy + s*0.5);
  legGrd.addColorStop(0, theme.pantsDark);
  legGrd.addColorStop(1, theme.pantsLight);
  ctx.fillStyle = legGrd;
  ctx.fillRect(cx - s*0.18 + legOff, cy, s*0.15, s*0.45);
  ctx.fillRect(cx + s*0.03 - legOff, cy, s*0.15, s*0.45);
  
  ctx.fillStyle = '#f5f5dc';
  ctx.beginPath(); ctx.ellipse(cx - s*0.1 + legOff, cy + s*0.45, s*0.12, s*0.06, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + s*0.11 - legOff, cy + s*0.45, s*0.12, s*0.06, 0, 0, Math.PI*2); ctx.fill();

  const robeGrd = ctx.createLinearGradient(cx - s*0.4, cy - s*0.9, cx + s*0.4, cy);
  robeGrd.addColorStop(0, theme.robeLight);
  robeGrd.addColorStop(0.7, theme.robeDark);
  robeGrd.addColorStop(1, '#000');
  
  ctx.fillStyle = robeGrd;
  ctx.beginPath();
  ctx.moveTo(cx - s*0.35, cy + s*0.05);
  ctx.lineTo(cx - s*0.30, cy - s*0.85);
  ctx.bezierCurveTo(cx - s*0.15, cy - s*1.05, cx + s*0.15, cy - s*1.05, cx + s*0.30, cy - s*0.85);
  ctx.lineTo(cx + s*0.35, cy + s*0.05);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = theme.patternColor;
  ctx.lineWidth = Math.max(1, s*0.02);
  ctx.fillStyle = theme.patternColor;
  for (let i = 0; i < 6; i++) {
    let px = cx - s*0.2 + (i%2)*s*0.15;
    let py = cy - s*0.2 - Math.floor(i/2)*s*0.2;
    ctx.beginPath();
    ctx.moveTo(px, py - s*0.04);
    ctx.lineTo(px + s*0.04, py);
    ctx.lineTo(px, py + s*0.04);
    ctx.lineTo(px - s*0.04, py);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  ctx.fillStyle = theme.vest;
  ctx.beginPath();
  ctx.moveTo(cx - s*0.15, cy - s*0.85);
  ctx.lineTo(cx + s*0.15, cy - s*0.85);
  ctx.lineTo(cx + s*0.2, cy - s*0.4);
  ctx.lineTo(cx - s*0.2, cy - s*0.4);
  ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = theme.sash;
  ctx.beginPath();
  ctx.moveTo(cx - s*0.32, cy - s*0.45);
  ctx.lineTo(cx + s*0.32, cy - s*0.45);
  ctx.lineTo(cx + s*0.34, cy - s*0.35);
  ctx.lineTo(cx - s*0.34, cy - s*0.35);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = theme.robeDark;
  if (isElder) {
    ctx.beginPath(); ctx.ellipse(cx + s*0.3, cy - s*0.7, s*0.1, s*0.25, 0.2, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(cx + s*0.35, cy - s*0.65, s*0.1, s*0.2, -0.5, 0, Math.PI*2); ctx.fill();
  }

  const headGrd = ctx.createRadialGradient(cx - s*0.05, cy - s*1.2, s*0.02, cx + s*0.05, cy - s*1.1, s*0.25);
  headGrd.addColorStop(0, '#fff1d0');
  headGrd.addColorStop(1, '#d4a373');
  ctx.fillStyle = headGrd;
  ctx.beginPath();
  ctx.arc(cx + s*0.02, cy - s*1.1, s*0.24, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#1a0a00';
  ctx.beginPath(); ctx.arc(cx + s*0.12, cy - s*1.15, s*0.025, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx - s*0.08, cy - s*1.15, s*0.025, 0, Math.PI*2); ctx.fill();
  
  if (isElder) {
    ctx.fillStyle = '#e0e0e0';
    ctx.beginPath();
    ctx.moveTo(cx - s*0.15, cy - s*0.95);
    ctx.quadraticCurveTo(cx + s*0.02, cy - s*0.7, cx + s*0.18, cy - s*0.95);
    ctx.quadraticCurveTo(cx + s*0.02, cy - s*0.9, cx - s*0.15, cy - s*0.95);
    ctx.fill();
    
    ctx.fillStyle = theme.hat;
    ctx.beginPath();
    ctx.ellipse(cx + s*0.02, cy - s*1.3, s*0.28, s*0.16, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - s*0.2, cy - s*1.3); ctx.lineTo(cx + s*0.25, cy - s*1.35); ctx.stroke();
    
    ctx.strokeStyle = '#4a2e15';
    ctx.lineWidth = s*0.06;
    ctx.beginPath();
    ctx.moveTo(cx + s*0.38, cy + s*0.05);
    ctx.lineTo(cx + s*0.45, cy - s*1.6);
    ctx.stroke();
    ctx.fillStyle = '#d4af37';
    ctx.beginPath(); ctx.arc(cx + s*0.45, cy - s*1.6, s*0.08, 0, Math.PI*2); ctx.fill();
    
  } else {
    ctx.fillStyle = theme.hat;
    ctx.beginPath();
    ctx.ellipse(cx + s*0.02, cy - s*1.28, s*0.25, s*0.12, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = theme.hatBand;
    ctx.fillRect(cx - s*0.15, cy - s*1.3, s*0.35, s*0.08);
    
    ctx.fillStyle = '#a16207';
    ctx.beginPath();
    ctx.ellipse(cx + s*0.38, cy - s*0.45, s*0.18, s*0.15, -0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(cx + s*0.3, cy - s*0.55, s*0.06, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(cx + s*0.45, cy - s*0.5, s*0.06, 0, Math.PI*2); ctx.fill();
  }
  
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = s*0.03;
  ctx.beginPath();
  ctx.moveTo(cx - s*0.2, cy - s*0.8);
  ctx.quadraticCurveTo(cx - s*0.1, cy - s*0.4, cx - s*0.25, cy);
  ctx.stroke();

  ctx.restore();
}

/* ═══════ MARKERS & LABELS ═══════ */
function drawMarker(x, y, color, alpha, scale, isJustCrossed){
  if(alpha <= 0.01) return;
  const s = gardenerSize * 0.45 * (scale || 1);
  ctx.save();
  ctx.globalAlpha = alpha;
  
  ctx.fillStyle = color + '40'; 
  ctx.beginPath();
  ctx.arc(x, y, s * 1.2, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, s*0.6, 0, Math.PI*2);
  ctx.fill();
  
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#fff';
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x, y, s*0.25, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  
  ctx.restore();
}

function drawLabel(text, x, y, opt){
  opt = opt || {};
  const size = opt.size || gardenerSize * 0.7;
  ctx.save();
  ctx.font = '900 ' + size + 'px Vazirmatn, Tahoma, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  try{ ctx.direction = 'rtl'; }catch(e){}
  
  ctx.fillStyle = opt.color || '#fff';
  ctx.fillText(text, x, y);
  ctx.restore();
}

/* ═══════ STORY RENDER ═══════ */
function getStoryPositions(t){
  const walkStart = 4.0, walkDur = 6.0;
  const s = clamp((t - walkStart) / walkDur, 0, 1);
  const L = getLayout();
  return {
    elder: {
      x: lerp(L.elder.start.x, L.elder.end.x, s),
      y: lerp(L.elder.start.y, L.elder.end.y, s)
    },
    younger: {
      x: lerp(L.younger.start.x, L.younger.end.x, s),
      y: lerp(L.younger.start.y, L.younger.end.y, s)
    },
    s: s
  };
}

function renderStory(dt){
  const t = state.story.t;
  const bgAlpha = easeOut(seg(t, 0, 0.8));
  const chAlpha1 = easeOut(seg(t, 1.0, 1.5));
  const chAlpha2 = easeOut(seg(t, 1.3, 1.8));
  const chAlpha3 = easeOut(seg(t, 1.6, 2.1));
  const pathAlpha = easeOut(seg(t, 2.3, 2.9));
  const gardenerAlpha = easeOut(seg(t, 3.2, 3.7));
  const L = getLayout();

  drawBackground(bgAlpha, dt);

  drawChannel(L.channels[2], chAlpha3, -t * 40, '#5eead4');
  drawChannel(L.channels[1], chAlpha2, -t * 40, '#fbbf24');
  drawChannel(L.channels[0], chAlpha1, -t * 40, '#5eead4');

  const { elder, younger, s } = getStoryPositions(t);
  drawPath(L.elder.start, L.elder.end, s, '#00b4d8', pathAlpha * 0.9); 
  drawPath(L.younger.start, L.younger.end, s, '#ffd60a', pathAlpha * 0.9); 

  const cross = getCrossings();
  const totalWalk = START_Y - END_Y;
  const c3 = 4.0 + ((START_Y - CHANNELS_Y[2]) / totalWalk) * 6.0;
  const c2 = 4.0 + ((START_Y - CHANNELS_Y[1]) / totalWalk) * 6.0;
  const c1 = 4.0 + ((START_Y - CHANNELS_Y[0]) / totalWalk) * 6.0;

  if(t >= c3){
    const a = easeOutBack(seg(t, c3, c3+0.3));
    const isJust = t - c3 < 0.4;
    drawMarker(cross.elder[2].x, cross.elder[2].y, '#00b4d8', a, 1, isJust);
    drawMarker(cross.younger[2].x, cross.younger[2].y, '#ffd60a', a, 1, isJust);
  }
  if(t >= c2){
    const a = easeOutBack(seg(t, c2, c2+0.3));
    const isJust = t - c2 < 0.4;
    drawMarker(cross.elder[1].x, cross.elder[1].y, '#00b4d8', a, 1, isJust);
    drawMarker(cross.younger[1].x, cross.younger[1].y, '#ffd60a', a, 1, isJust);
  }
  if(t >= c1){
    const a = easeOutBack(seg(t, c1, c1+0.3));
    const isJust = t - c1 < 0.4;
    drawMarker(cross.elder[0].x, cross.elder[0].y, '#00b4d8', a, 1, isJust);
    drawMarker(cross.younger[0].x, cross.younger[0].y, '#ffd60a', a, 1, isJust);
  }

  if(gardenerAlpha > 0.01){
    const walkPhase = (t > 4.0 && t < 10.0) ? (t - 4.0) : 0;
    const elderTheme = {
      robeLight: '#991b1b', robeDark: '#450a0a', patternColor: '#fbbf24', 
      vest: '#d97706', sash: '#eab308', pantsDark: '#111827', pantsLight: '#374151',
      hat: '#f8fafc', hatBand: '#94a3b8' 
    };
    const youngerTheme = {
      robeLight: '#0f766e', robeDark: '#042f2e', patternColor: '#f97316',
      vest: '#b91c1c', sash: '#fbbf24', pantsDark: '#1c1917', pantsLight: '#44403c',
      hat: '#0ea5e9', hatBand: '#bae6fd'
    };
    drawGardener(elder.x, elder.y, elderTheme, gardenerAlpha, true, walkPhase);
    drawGardener(younger.x, younger.y, youngerTheme, gardenerAlpha, false, walkPhase);
  }

  if(t >= c3){
    const a = easeOut(seg(t, c3, c3+0.4));
    ctx.globalAlpha = a;
    drawLabel('C', cross.elder[2].x - gardenerSize*1.3, cross.elder[2].y, {color:'#00b4d8'});
    drawLabel("C'", cross.younger[2].x + gardenerSize*1.3, cross.younger[2].y, {color:'#ffd60a'});
    ctx.globalAlpha = 1;
  }
  if(t >= c2){
    const a = easeOut(seg(t, c2, c2+0.4));
    ctx.globalAlpha = a;
    drawLabel('B', cross.elder[1].x - gardenerSize*1.3, cross.elder[1].y, {color:'#00b4d8'});
    drawLabel("B'", cross.younger[1].x + gardenerSize*1.3, cross.younger[1].y, {color:'#ffd60a'});
    ctx.globalAlpha = 1;
  }
  if(t >= c1){
    const a = easeOut(seg(t, c1, c1+0.4));
    ctx.globalAlpha = a;
    drawLabel('A', cross.elder[0].x - gardenerSize*1.3, cross.elder[0].y, {color:'#00b4d8'});
    drawLabel("A'", cross.younger[0].x + gardenerSize*1.3, cross.younger[0].y, {color:'#ffd60a'});
    ctx.globalAlpha = 1;
  }
}

function render(dt){
  if(Wc < 10 || Hc < 10) return;
  ctx.clearRect(0, 0, Wc, Hc);
  try{ renderStory(dt); }catch(e){ console.warn(e); }
}

/* ═══════ OPTIMIZED LOOP (30 FPS) ═══════ */
let lastTs = 0;
let lastRenderTime = 0;
const FPS = 30;
const FPS_INTERVAL = 1000 / FPS;

function loop(ts){
  requestAnimationFrame(loop);
  
  const delta = ts - lastRenderTime;
  if (delta < FPS_INTERVAL) return; 
  
  lastRenderTime = ts - (delta % FPS_INTERVAL);
  
  if(!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if(dt > 0.06) dt = 0.06;
  
  globalTime += dt;

  if(state.story.running){
    state.story.t += dt;
    if(state.story.t >= TOTAL){
      state.story.t = TOTAL;
      state.story.running = false;
    }
  }
  render(dt);
}

/* ═══════ UI ═══════ */
const overlay = document.getElementById('overlay');
function clearOverlay(){ overlay.innerHTML = ''; }

function buildStoryPanel(){
  clearOverlay();
  const div = document.createElement('div');
  div.className = 'panel';
  
  div.innerHTML = `
    <div class="formula-wrapper">
      <div class="frac-box">
        <span class="frac-num"><span class="math-var">A</span><span class="math-var">B</span></span>
        <span class="frac-den"><span class="math-var">B</span><span class="math-var">C</span></span>
      </div>
      
      <span class="math-eq">=</span>
      
      <div class="frac-box">
        <span class="frac-num"><span class="math-var">A</span><span class="math-prime">'</span><span class="math-var">B</span><span class="math-prime">'</span></span>
        <span class="frac-den"><span class="math-var">B</span><span class="math-prime">'</span><span class="math-var">C</span><span class="math-prime">'</span></span>
      </div>
    </div>
    <div class="designer-name">Mojgan Beniasad-Azad</div>
  `;
  overlay.appendChild(div);
}

/* ═══════ CONTROLS ═══════ */
document.getElementById('replayBtn').onclick = () => {
  if(AC && AC.state === 'running') Ambience.start();
  state.story.t = 0;
  state.story.fired = [];
  state.story.running = true;
};

muteBtnEl.onclick = function(e) {
  e.stopPropagation(); 
  unlockAudio(); 
  const m = !MUTED;
  if(AC && MASTER) {
    MASTER.gain.setTargetAtTime(m ? 0 : 1, AC.currentTime, 0.1);
  }
  MUTED = m;
  this.textContent = m ? '🔇' : '🔊';
  this.classList.toggle('muted', m);
};

/* ═══════ BOOT ═══════ */
resizeAttempts = 0;
resize();
requestAnimationFrame(()=>{ resizeAttempts = 0; resize(); });

initAudioEngine();
if (AC && AC.state === 'running') {
  Ambience.start();
  muteBtnEl.classList.remove('pulse-audio');
  audioPrompt.classList.add('hidden');
}

document.addEventListener('click', unlockAudio, { once: true });
document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
document.addEventListener('pointerdown', unlockAudio, { once: true });
document.addEventListener('keydown', unlockAudio, { once: true });

state.story.running = true;
buildStoryPanel();
render(0);
requestAnimationFrame(loop);

})();
</script>
